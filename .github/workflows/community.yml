name: Update leaderboard snapshot

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - 'community/**'
      - '.github/workflows/community.yml'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ozone-mystery-community
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.repository_owner != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test parsers and ranking
        run: node --test community/community.test.mjs
      - name: Rebuild snapshot from Issues
        run: node community/sync.mjs --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit and push snapshot
        run: |
          if git diff --quiet community/scores.json; then
            echo "无变化，跳过提交。"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add community/scores.json
            git commit -m "chore: 更新社区榜单快照 [skip ci]"
            git push
          fi
